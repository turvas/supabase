# -----------------------------------------------------------------
# External authentication and topic access plugin options
# -----------------------------------------------------------------

# External authentication and access control can be supported with the
# auth_plugin option. This is a path to a loadable plugin. See also the
# auth_opt_* options described below.
#
# The auth_plugin option can be specified multiple times to load multiple
# plugins. The plugins will be processed in the order that they are specified
# here. If the auth_plugin option is specified alongside either of
# password_file or acl_file then the plugin checks will be made first.
#
#auth_plugin
auth_plugin /mosquitto/go-auth.so
auth_opt_backends postgres,files
# for initial conf, maybe not needed
auth_opt_anonusername AnonymouS

auth_opt_log_level info
auth_opt_log_dest file
auth_opt_log_file /var/log/mosquitto-auth.log

# generic auth options, matched to Flask passwords store
#auth_opt_hasher_salt_size 8           # salt bytes length
#auth_opt_hasher_iterations 150000      # number of iterations
#auth_opt_hasher_keylen 64              # key length
#auth_opt_hasher_algorithm sha256       # hashing algorithm, either sha512 (default) or sha256
#auth_opt_hasher_salt_encoding utf-8    # salt encoding, either base64 (default) or utf-8

# generic defaults are used by files plugin
auth_opt_hasher pbkdf2
auth_opt_hasher_salt_size 24          # salt bytes length
auth_opt_hasher_iterations 100000      # number of iterations
auth_opt_hasher_keylen 88              # key length
auth_opt_hasher_algorithm sha512       # hashing algorithm, either sha512 (default) or sha256
#auth_opt_hasher_salt_encoding          # salt encoding, either base64 (default) or utf-8

# file plugin backend settings
# test1:PBKDF2$sha512$100000$2WQHK5rjNN+oOT+TZAsWAw==$TDf4Y6J+9BdnjucFQ0ZUWlTwzncTjOOeE00W4Qm8lfPQyPCZACCjgfdK353jdGFwJjAf6vPAYaba9+z4GWK7Gg==
# old version vars
#auth_opt_password_path /mosquitto/config/users.go
#auth_opt_acl_path /mosquitto/config/acl.conf
# new version vars
auth_opt_files_password_path /mosquitto/config/users.go
auth_opt_files_acl_path /mosquitto/config/acl.conf

# If the auth_plugin option above is used, define options to pass to the
# plugin here as described by the plugin instructions. All options named
# using the format auth_opt_* will be passed to the plugin, for example:
#
#auth_opt_db_host 10.10.10.6
#auth_opt_db_port 5432
#auth_opt_db_username postgres
#auth_opt_db_password propass123
# Postgres backend
auth_opt_pg_host db
auth_opt_pg_port 5432
auth_opt_pg_user mosquitto
auth_opt_pg_password 5VHHpMXkxdD3
auth_opt_pg_dbname postgres
auth_opt_pg_userquery SELECT password_hash FROM users WHERE first_name = $1 limit 1
auth_opt_pg_superquery SELECT COUNT(*) FROM users WHERE email = $1 AND role_id = 2
# missing auth reult full access to every topic, TODO add query
#auth_opt_pg_aclquery 
#auth_opt_pg_sslmode
auth_opt_pg_sslmode disable

# special options for postgre
# pbkdf2:sha256:150000$HZf93Nnh$10bea0d54e9ad9a8c263d9038ff2c1889ba2017c80043bcead3934dc833f955c
auth_opt_pg_hasher pbkdf2
auth_opt_pg_hasher_salt_size 8           # salt bytes length
auth_opt_pg_hasher_iterations 150000      # number of iterations
auth_opt_pg_hasher_keylen 72              # key length
auth_opt_pg_hasher_algorithm sha256       # hashing algorithm, either sha512 (default) or sha256
auth_opt_pg_hasher_salt_encoding utf-8    # salt encoding, either base64 (default) or utf-8

